name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mast_emulator:
        description: Run grouped lifecycle and signed child/parent emulator tests (KVM)
        type: boolean
        default: false

permissions:
  contents: read

env:
  OPENWRT_VERSION: 25.12.4

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax + structure
        run: ./scripts/test-syntax.sh

      # The integration test runs the Go core (phone identity) next to the shell plugin.
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.mod

      - name: Integration (real fw4 + nftables in OpenWrt rootfs)
        env:
          OPENWRT_IMAGE: openwrt/rootfs:x86-64-${{ env.OPENWRT_VERSION }}
        run: ./scripts/test-integration.sh

      - name: AdGuard Home sync (throwaway AdGuard Home container)
        run: ./scripts/test-agh.sh

  core:
    name: Go core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.mod

      - name: Format, vet, test (race)
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Portable service dependency boundary
        run: |
          go list -deps ./internal/service > "$RUNNER_TEMP/portable-service-deps.txt"
          ! grep -Fxq 'github.com/denogio/familywarden/core/internal/openwrt' "$RUNNER_TEMP/portable-service-deps.txt"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Install browser for the shell-free service proof
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Shared UI against the portable production service
        env:
          FW_TEST_SHARED_UI: '1'
        run: go test -race ./internal/service -run '^TestPortableSharedUI$' -count=1

      - name: Build for the router (linux/arm64, static)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o familywardend ./cmd/familywardend
          ls -l familywardend

  build:
    name: Build apks
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historical source migration fixtures use local release tags

      # All three packages: the core is cross-compiled with plain Go (seconds) and
      # only packaged by the SDK; familywarden depends on it (phone identity).
      - name: Build with OpenWrt SDK
        env:
          SDK_IMAGE: openwrt/sdk:x86-64-${{ env.OPENWRT_VERSION }}
          OUT: ${{ runner.temp }}/apk
        run: ./scripts/build-apk-docker.sh

      - name: Smoke-test apks (install, postinst, reinstall, remove)
        env:
          OPENWRT_IMAGE: openwrt/rootfs:x86-64-${{ env.OPENWRT_VERSION }}
        run: ./scripts/test-apk.sh "${{ runner.temp }}/apk"

      - name: Migrate tagged legacy state into the built packages
        env:
          OPENWRT_IMAGE: openwrt/rootfs:x86-64-${{ env.OPENWRT_VERSION }}
        run: ./scripts/test-upgrade.sh "${{ runner.temp }}/apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error

  core-aarch64:
    name: Core apk (aarch64_cortex-a53)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mediatek/filogic = aarch64_cortex-a53 (e.g. Cudy WR3000). The shell and LuCI
      # packages are architecture-independent; only the core differs per arch.
      - name: Build with OpenWrt SDK
        env:
          SDK_IMAGE: openwrt/sdk:mediatek-filogic-${{ env.OPENWRT_VERSION }}
          OUT: ${{ runner.temp }}/apk
        run: ./scripts/build-apk-docker.sh

      - uses: actions/upload-artifact@v7
        with:
          name: core-aarch64
          path: ${{ runner.temp }}/apk/familywarden-core-*.apk
          if-no-files-found: error

  e2e:
    name: LuCI e2e (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apk

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Install Playwright
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run against LuCI in an OpenWrt container
        env:
          OPENWRT_IMAGE: openwrt/rootfs:x86-64-${{ env.OPENWRT_VERSION }}
          # Phase 2: core-owned configuration (import, CAS, pact DNS) in a second fresh container
          FW_E2E_OWNED: '1'
        run: ./scripts/test-e2e.sh apk

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: test/e2e/test-results

  mast:
    name: Ulysses Mast (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Unit tests and APKs
        working-directory: android
        env:
          MAST_KEYSTORE_B64: ${{ secrets.MAST_KEYSTORE_B64 }}
          MAST_KEYSTORE_PASSWORD: ${{ secrets.MAST_KEYSTORE_PASSWORD }}
          MAST_VERSION_CODE: ${{ github.run_number }}
        run: |
          # Same version as the familywarden package; versionCode always increases
          MAST_VERSION_NAME=$(sed -n 's/^PKG_VERSION:=//p' ../familywarden/Makefile)
          export MAST_VERSION_NAME
          if [ -n "$MAST_KEYSTORE_B64" ]; then
            echo "$MAST_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mast.jks"
            export MAST_KEYSTORE="$RUNNER_TEMP/mast.jks"
          fi
          python3 ../test/android/test_check_navigation.py
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease assembleDebug
          mkdir -p "$RUNNER_TEMP/mast"
          cp app/build/outputs/apk/release/app-release*.apk "$RUNNER_TEMP/mast/ulysses-mast-$MAST_VERSION_NAME.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/mast/ulysses-mast-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: mast
          path: ${{ runner.temp }}/mast/*.apk
          if-no-files-found: error

  mast-emulator:
    name: Ulysses Mast on Android (emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.mast_emulator
    needs: [build, mast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apk

      - uses: actions/download-artifact@v8
        with:
          name: mast
          path: mast

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device owner, pairing and the tethering restriction on Android 15
        run: ./scripts/test-mast-emulator.sh apk mast/ulysses-mast-debug.apk

      - name: Signed child requests and ordinary parent approvals on Android 15
        env:
          OUT: ${{ runner.temp }}/familywarden-requests
        run: ./scripts/test-requests-emulator.sh apk mast/ulysses-mast-debug.apk

      - name: Preserve synthetic request diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mast-requests-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/familywarden-requests/*.log
            ${{ runner.temp }}/familywarden-requests/*.json
            ${{ runner.temp }}/familywarden-requests/*.xml
            ${{ runner.temp }}/familywarden-requests/*.png

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, core-aarch64, e2e, mast]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match familywarden PKG_VERSION
        id: ver
        run: |
          fw=$(sed -n 's/^PKG_VERSION:=//p' familywarden/Makefile)
          luci=$(sed -n 's/^PKG_VERSION:=//p' luci-app-familywarden/Makefile)
          if [ "${GITHUB_REF_NAME}" != "v${fw}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match familywarden PKG_VERSION ${fw}"
            exit 1
          fi
          echo "fw=$fw" >> "$GITHUB_OUTPUT"
          echo "luci=$luci" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apk

      - uses: actions/download-artifact@v8
        with:
          name: mast
          path: mast

      - uses: actions/download-artifact@v8
        with:
          name: core-aarch64
          path: core-aarch64

      # Same file name per arch: suffix it so both fit in one release.
      - name: Name core packages by architecture
        run: |
          for f in apk/familywarden-core-*.apk; do mv "$f" "${f%.apk}-x86_64.apk"; done
          for f in core-aarch64/familywarden-core-*.apk; do mv "$f" "apk/$(basename "${f%.apk}")-aarch64_cortex-a53.apk"; done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Packages (OpenWrt ${OPENWRT_VERSION}+ / apk):

          - \`familywarden\` ${{ steps.ver.outputs.fw }} and \`luci-app-familywarden\` ${{ steps.ver.outputs.luci }} (architecture-independent)
          - \`familywarden-core\` for your router's architecture (\`x86_64\` or \`aarch64_cortex-a53\`); familywarden depends on it

          Install on the router (pick the core for its architecture, see \`/etc/openwrt_release\`):

          \`\`\`sh
          apk add --allow-untrusted ./familywarden-core-*-aarch64_cortex-a53.apk ./familywarden-[0-9]*.apk ./luci-app-familywarden-*.apk
          \`\`\`

          Ulysses Mast (the captain's phone, Android): see docs/ulysses-mast.md

          \`\`\`sh
          adb install ulysses-mast-*.apk
          adb shell dpm set-device-owner io.github.denogio.familywarden/.AdminReceiver
          \`\`\`
          EOF
          gh release create "${GITHUB_REF_NAME}" apk/familywarden-[0-9]*.apk apk/familywarden-core-*.apk apk/luci-app-familywarden-*.apk \
            mast/ulysses-mast-${{ steps.ver.outputs.fw }}.apk \
            --title "FamilyWarden ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
